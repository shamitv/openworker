[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-memory-bench"
version = "0.1.0"
description = "Portable synthetic memory benchmark with SQLite operations and deterministic scoring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
memory-bench = "memory_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_bench = ["assets/*.json", "assets/corpus/*.json", "assets/policies/*.md", "assets/protocol/*.md", "assets/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
